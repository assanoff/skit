version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # correctness
    - asasalint
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - forcetypeassert
    - gochecksumtype
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - predeclared
    - reassign
    - recvcheck
    - staticcheck
    - unparam
    - unused
    - wastedassign
    # resources and I/O: response bodies, rows, spans, request contexts
    - bodyclose
    - noctx
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - unqueryvet
    # security and dependencies
    - asciicheck
    - bidichk
    - depguard
    - forbidigo
    - gocheckcompilerdirectives
    - gomoddirectives
    - gosec
    # idioms and documentation
    - canonicalheader
    - dupword
    - embeddedstructfieldcheck
    - errname
    - exptostd
    - gocritic
    - godoclint
    - godot
    - iface
    - inamedparam
    - intrange
    - mirror
    - misspell
    - modernize
    - perfsprint
    - protogetter
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
    # complexity and duplication
    - dupl
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - nakedret
    - nestif
    - prealloc
    # tests and nolint directives
    - nolintlint
    - thelper
    - tparallel
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use github.com/matryer/is
        # One semconv version: mixed versions drift attribute names and break the
        # schema URL of the Resource. otel, contrib and semconv move together.
        semconv:
          list-mode: lax
          allow: [go.opentelemetry.io/otel/semconv/v1.43.0]
          deny:
            - pkg: go.opentelemetry.io/otel/semconv
              desc: semconv is pinned to v1.43.0
        # SDK packages depend on the OTel API only; otel/setup installs the SDK
        # and otel/otlp builds the exporter.
        otel-sdk:
          files: ["!$test", "!**/otel/setup/*.go", "!**/otel/otlp/*.go"]
          deny:
            - pkg: go.opentelemetry.io/otel/sdk
              desc: use the OTel API; the SDK is installed by otel/setup
            - pkg: go.opentelemetry.io/otel/exporters
              desc: the exporter is built by otel/otlp
            - pkg: go.opentelemetry.io/contrib/bridges
              desc: bridges belong to otel/setup
    dupword:
      ignore: [nil] # "(nil, nil)" in doc comments
    errcheck:
      # Writes to stdout/stderr (CLI progress, log lines) don't warrant error
      # handling; everything else must still be checked.
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln]
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^trace\.Span\.RecordError$
          msg: mark the span with otel.SetError (status Error and error.type); the details go to the log record
        # Global OTel state is set by otel/setup only (excluded below).
        - pattern: ^otel\.Set
          pkg: ^go\.opentelemetry\.io/otel$
          msg: pass a TracerProvider; otel/setup installs the global provider and propagator
    exhaustruct_v5:
      explicit-mode: true # only types marked //exhaustruct:enforce
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags: [diagnostic, performance, style, experimental, opinionated]
      disabled-checks: [wrapperFunc, hugeParam, rangeValCopy, unnamedResult, whyNoLint]
    gocyclo:
      min-complexity: 20
    godoclint:
      default: basic
      enable: [require-doc, require-pkg-doc, no-unused-link]
    gosec:
      excludes:
        - G704 # SSRF taint analysis: false positive for an HTTP-client SDK
        - G705 # XSS taint analysis: false positive (JSON error bodies via errs)
    govet:
      enable-all: true
      disable: [fieldalignment]
    misspell:
      locale: US
    nestif:
      min-complexity: 5
    nilnil:
      # A nil func means "nothing to do" by contract (dim.CleanupFunc without
      # cleanup, a request without a body), so func results are not checked.
      checked-types: [chan, iface, map, ptr, uintptr, unsafeptr]
    nolintlint:
      require-explanation: true
      require-specific: true
    recvcheck:
      exclusions: ["*.Value"] # driver.Valuer needs a value receiver, Scan a pointer one
    revive:
      enable-default-rules: true
      rules:
        - name: atomic
        - name: bool-literal-in-expr
        - name: comment-spacings
        - name: constant-logical-expr
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
        - name: identical-branches
        - name: modifies-value-receiver
        - name: redundant-import-alias
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: use-any
        - name: waitgroup-by-value
    sloglint:
      context: all   # the ctx carries the span the record is correlated with
      no-global: all # log through the injected *slog.Logger
    staticcheck:
      checks: [all]
    wrapcheck:
      ignore-package-globs: [github.com/assanoff/skit/*]
      extra-ignore-sigs:
        - .Err()        # ctx.Err() is returned as is
        - .Write(       # ResponseWriter / io.Writer wrappers pass the error through
        - .Handle(      # slog.Handler wrappers
        - .RoundTrip(   # http.RoundTripper wrappers
        - .ExportSpans( # sdktrace.SpanExporter wrappers
        - status.Error( # a gRPC status must not be wrapped
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [containedctx, contextcheck, dupl, errcheck, exhaustruct_v5, forcetypeassert,
          gocritic, goconst, godoclint, gosec, noctx, prealloc, unparam, unqueryvet, wrapcheck]
      - path: _test\.go
        linters: [revive, unused]
        text: unused-parameter
      # go vet's shadow check flags idiomatic `if err := ...` in tests; allow it.
      - path: _test\.go
        linters: [govet]
        text: "shadow:"
      # Generated mocks are not held to our style rules.
      - path: mocks/
        linters: [dupl, revive, unparam]
      # The scaffolding CLI creates dirs and files, runs subprocesses and reads
      # paths from its arguments; it prints errors to the terminal, and os.*
      # errors already carry the path. Its commands have no context: Ctrl+C
      # reaches a child process through the process group.
      - path: cmd/skit/
        linters: [gosec, noctx, wrapcheck]
      # dim and closer are package-level lifecycle helpers without a logger
      # parameter: they log init/shutdown through slog.Default(), which the
      # service routes into its own handler with slog.SetDefault.
      - path: ^(closer|dim)/
        linters: [sloglint]
      # The bootstrap is the one place that sets the global OTel state.
      - path: ^otel/setup/
        linters: [forbidigo]
        text: 'otel\.Set'
      # httplog is adapted third-party code kept close to upstream: only
      # correctness, resources and security are checked.
      - path: httplog/
        linters: [dupl, dupword, embeddedstructfieldcheck, gocognit, gocritic, gocyclo,
          godoclint, godot, gosec, nestif, perfsprint, revive, staticcheck, wrapcheck]
    paths: [third_party$, builtin$]

formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/assanoff/skit]
  exclusions:
    generated: lax
    paths: [httplog, third_party$, builtin$]
