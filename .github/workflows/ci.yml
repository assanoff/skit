name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Go comes from the go directive in go.mod; check-latest picks the newest patch
# release, so stdlib fixes arrive without a toolchain bump. Actions are pinned
# by commit SHA; Dependabot keeps the SHAs and version comments current.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Keep version in sync with GOLANGCI in the Makefile.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
      - name: Project rules, go fix and go.mod checks
        run: make lint-rules fix-check tidy-check

  # Verify semantic-version compatibility of the public module against the
  # latest release tag. Skipped on the first release (no tag yet).
  #
  # The showcase app (CRUD + integration tests against Postgres/RabbitMQ) lives
  # in its own repo (assanoff/skit-x) and is exercised by that repo's CI;
  # this workflow only covers the SDK module itself.
  gorelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags needed for the base comparison
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gorelease
        # gorelease infers the base from the latest tag (or "none" before the
        # first release) and prints the suggested next version. On v1+ it exits
        # non-zero if there are incompatible API changes without a major bump;
        # on v0.x incompatible changes are reported but do not fail the build.
        run: make gorelease
